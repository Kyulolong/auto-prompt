<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />

    <!-- 제목·설명은 홈페이지의 /services/prompt 와 일부러 다르게 쓴다. 두 페이지가
         같은 문구를 들고 있으면 검색에서 서로를 갉아먹는다. 소개 페이지는 "왜
         만들었나"를 읽으러 오는 곳이고, 여기는 "지금 쓰러" 오는 곳이라 그 의도에
         맞는 말을 싣는다. -->
    <title>보이스 프롬프터 · 목소리를 따라 내려오는 한국어 텔레프롬프터</title>
    <meta
      name="description"
      content="말하는 속도에 맞춰 대본이 알아서 따라 내려오는 한국어 텔레프롬프터. 설치 없이 브라우저에서 바로 쓰고, 오프라인 모드에서는 음성이 기기 밖으로 나가지 않습니다."
    />

    <!-- /prompt 와 /prompt/ 가 같은 문서를 그대로 내보낸다(둘 다 200, 바이트까지
         동일). 검색엔진에는 서로 다른 두 URL 이라, 정하지 않으면 평가가 둘로 쪼개진다.

         끝 슬래시 쪽으로 못을 박는 이유: 이 사이트의 규약이 그쪽이다. 홈페이지의
         lib/content/types.ts 에 있는 withTrailingSlash 가 서비스 frontmatter 의 url 을
         변환해서 /prompt/ 로 링크하고, 사이트맵에도 https://kyulolong.com/prompt/ 로
         나간다(형제 앱들도 전부 /wave-sound/ · /navigator/ 형태다). canonical 이
         사이트맵·내부링크와 어긋나면 색인에 서로 다른 신호를 주게 된다.

         밑바탕에는 상대경로 자산 문제가 있다. 끝 슬래시가 없으면 브라우저가 상대경로를
         한 단계 위, 즉 홈페이지 루트 기준으로 풀어버린다.

         아래 절대 URL 들은 도메인과 마운트 경로를 직접 들고 있다. og:image 는 규격상
         절대 URL 이어야 해서 Vite 의 base 로는 못 만든다 — manifest 와 같은 이유로,
         마운트 경로를 바꾸면 여기도 같이 고쳐야 한다. -->
    <link rel="canonical" href="https://kyulolong.com/prompt/" />
    <meta name="robots" content="index, follow, max-image-preview:large" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="규로롱" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:url" content="https://kyulolong.com/prompt/" />
    <meta property="og:title" content="보이스 프롬프터 — 목소리를 따라 대본이 알아서 내려옵니다" />
    <meta
      property="og:description"
      content="말하는 속도에 맞춰 대본이 따라 내려오는 한국어 텔레프롬프터. 설치 없이 브라우저에서 바로."
    />
    <meta property="og:image" content="https://kyulolong.com/prompt/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="보이스 프롬프터 — 대본 줄 가운데 지금 읽는 한 줄만 형광으로 켜져 있다" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="보이스 프롬프터 — 목소리를 따라 대본이 알아서 내려옵니다" />
    <meta
      name="twitter:description"
      content="말하는 속도에 맞춰 대본이 따라 내려오는 한국어 텔레프롬프터. 설치 없이 브라우저에서 바로."
    />
    <meta name="twitter:image" content="https://kyulolong.com/prompt/og.png" />

    <!-- 검색엔진에 "이건 글이 아니라 웹앱"이라고 알려준다. 별점(aggregateRating)은
         넣지 않는다 — 받은 적 없는 평가를 적는 순간 구조화 데이터 위반이다. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "보이스 프롬프터",
        "url": "https://kyulolong.com/prompt/",
        "description": "말하는 속도에 맞춰 대본이 알아서 따라 내려오는 한국어 텔레프롬프터.",
        "applicationCategory": "MultimediaApplication",
        "operatingSystem": "Web",
        "inLanguage": "ko",
        "isAccessibleForFree": true,
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "KRW" },
        "author": { "@type": "Person", "name": "규로롱", "url": "https://kyulolong.com" }
      }
    </script>
    <!-- 서비스 고유 아이콘. 앱 안 헤더 마크는 여전히 하우스 ㄱ+점이고(.logo),
         탭·홈화면 아이콘만 이 앱의 얼굴을 쓴다 — wave-sound 와 같은 구성이다.

         파비콘을 아예 선언하지 않으면 브라우저가 /favicon.ico 로 폴백하는데,
         이 앱은 kyulolong.com/prompt 에 얹혀 있어서 그 요청이 홈페이지로 간다.
         한동안 탭에 뜨던 마크는 그렇게 홈페이지 것을 빌려 쓰던 것이었다.

         경로를 루트 절대경로로 두는 이유: Vite 가 빌드할 때 base 를 붙여
         /prompt/icon-32.png 로 바꿔준다. 여기에 /prompt 를 직접 적으면 dev 에서
         이중으로 붙는다.

         16px 만 따로 그린 이유: 원본은 가는 막대가 6줄이라 16px 에서 회색
         덩어리로 뭉갠다(DESIGN.md §7 — "16px 로 렌더해서 확인하기 전엔 완성이
         아니다"). brand/icon-16.svg 가 같은 구성을 3줄로 줄인 광학 보정판이다.
         32px 부터는 원본이 그대로 읽히므로 축소만 한다.
         원본은 brand/app-icon-1024.png — 크기를 다시 뽑을 땐 거기서 뽑을 것. -->
    <link rel="icon" sizes="32x32" href="/icon-32.png" />
    <link rel="icon" sizes="16x16" href="/icon-16.png" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <!-- manifest 안의 start_url/scope 는 /prompt 를 직접 박고 있다. 정적 파일이라
         Vite 가 내용을 건드리지 않기 때문이다 — 마운트 경로를 바꾸면 vite.config 의
         base 와 여기 둘 다 고쳐야 한다. (아이콘 경로는 manifest 자기 주소 기준의
         상대경로라 그대로 따라온다) -->
    <link rel="manifest" href="/manifest.webmanifest" />
  </head>
  <body>
    <div id="root"></div>
    <!-- 이 앱은 전부 클라이언트에서 그린다. 자바스크립트가 꺼져 있으면 위 div 가
         빈 채로 남아서, 사람도 크롤러도 여기서 읽을 게 하나도 없다.
         화면에 있는 것과 같은 말만 적는다 — 다른 말을 심으면 그건 클로킹이다. -->
    <noscript>
      <div class="noscript">
        <h1>보이스 프롬프터</h1>
        <p>
          말하는 속도에 맞춰 대본이 알아서 따라 내려오는 한국어 텔레프롬프터입니다. 대본을
          붙여넣고 시작을 누르면, 지금 읽고 있는 위치를 찾아 그 줄을 화면 가운데에 붙들어
          둡니다. 마이크가 없을 때는 일정한 속도로 미는 자동 스크롤로도 쓸 수 있습니다.
        </p>
        <p>
          오프라인 엔진을 고르면 인식이 기기 안에서 끝나서 음성이 밖으로 나가지 않습니다.
          쓰려면 자바스크립트를 켜 주세요.
        </p>
        <p><a href="https://kyulolong.com/services/prompt">서비스 소개 보기</a></p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
