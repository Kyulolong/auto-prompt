# Serves the built SPA.
#
# Every path here is root-relative even though the app lives at
# kyulolong.com/prompt: Traefik strips the /prompt prefix before the request
# reaches this container. The /prompt/ the browser asks for comes from Vite's
# `base`, not from anything in this file — so the two have to stay in sync.
#
# This replaces what netlify.toml used to do.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Cross-origin isolation. Without it the offline Vosk engine can't get a
    # SharedArrayBuffer and its WASM recognizer dies on load. The Web Speech
    # engine needs none of it and doesn't mind.
    #
    # nginx gotcha: add_header does not inherit into a location that declares
    # its own add_header — it replaces the entire set. So every location below
    # that adds a header of its own repeats these two.
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Embedder-Policy require-corp always;

    # Worth it on the JS bundle; deliberately excludes application/octet-stream
    # so the model below is never touched.
    gzip on;
    gzip_min_length 1024;
    gzip_types text/css text/plain application/javascript application/json image/svg+xml;

    # The Korean model: a gzipped tar served under a .bin name on purpose, so no
    # server sets Content-Encoding: gzip on it and the browser doesn't
    # pre-decompress what vosk-browser wants to un-gzip itself.
    #
    # `types { }` empties the extension map for this location, so everything
    # here falls through to default_type — the content type holds even if the
    # file is renamed.
    location /models/ {
        types { }
        default_type application/octet-stream;

        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;

        # No SPA fallback here on purpose: a missing model must 404, not hand
        # back index.html for vosk-browser to choke on as if it were model bytes.
        try_files $uri =404;
    }

    # Hashed filenames, so these are safe to cache forever. Same =404 reasoning:
    # a stale asset request should fail as an asset, not as HTML.
    location /assets/ {
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;

        try_files $uri =404;
    }

    # index.html is what carries the current asset hashes, so caching it would
    # keep serving the previous bundle after a deploy. try_files' fallback below
    # re-enters location matching, so this applies to the fallback too.
    # nginx 기본 mime.types 에 .webmanifest 가 없는 버전이 있다. 그러면 매니페스트가
    # application/octet-stream 으로 나가고 브라우저가 통째로 무시한다 — 홈 화면에
    # 추가했을 때 이름도 아이콘도 안 붙는 형태로 조용히 실패한다.
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;

        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header Cache-Control "no-cache" always;
    }

    location = /index.html {
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
